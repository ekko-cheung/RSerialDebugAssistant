name: Release

# Two triggers:
#   1. Push to `main` — continuous AppImage build (Ubuntu 22.04), uploaded as a
#      workflow artifact. No release is created.
#   2. Push a version tag Vx.y.z / vx.y.z — full release. The gate job requires:
#        a. the tagged commit is on `release`
#        b. version.json changed vs the previous version tag
#        c. the tag is Vx.y.z / vx.y.z and matches version.json
#      Windows NSIS `.exe`, macOS Apple Silicon `.dmg` and Linux `.AppImage`
#      are built and attached to the GitHub Release.
on:
  push:
    branches:
      - main
    tags:
      - 'V*.*.*'
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Release path (version tag push only)
  # ---------------------------------------------------------------------------
  gate:
    name: Release gate
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Evaluate release conditions
        id: check
        run: bash scripts/ci-release-gate.sh

  build:
    name: Build ${{ matrix.name }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: --bundles nsis
            rust_targets: x86_64-pc-windows-msvc
          - name: macOS
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            rust_targets: aarch64-apple-darwin
          - name: Linux (AppImage)
            platform: ubuntu-22.04
            args: --bundles appimage
            rust_targets: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Write App Store Connect API key
        if: matrix.platform == 'macos-latest'
        id: apple_api_key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY }}
        run: |
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${KEY_ID}.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "path=${KEY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Build and attach to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_PATH: ${{ steps.apple_api_key.outputs.path }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: RSerial Debug Assistant ${{ needs.gate.outputs.version }}
          releaseBody: |
            ${{ github.ref_name }}

            - Windows: `.exe` (NSIS installer, unsigned)
            - macOS (Apple Silicon): signed and notarized `.dmg`
            - Linux: `.AppImage`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ---------------------------------------------------------------------------
  # Continuous AppImage build (main branch push only)
  # ---------------------------------------------------------------------------
  build-appimage:
    name: Build AppImage (Ubuntu 22.04)
    if: github.ref_type == 'branch'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build AppImage
        run: npx @tauri-apps/cli@2 build --bundles appimage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSerial-Debug-Assistant-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

  # ---------------------------------------------------------------------------
  # Release notes (version tag push only)
  # ---------------------------------------------------------------------------
  release-notes:
    name: Fill release notes
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate notes from commits since the previous tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NOTES="$(gh api "repos/${REPO}/releases/generate-notes" -f tag_name="${TAG}" --jq .body)"
          BODY="$(printf '%s\n\n%s\n' "${TAG}" "${NOTES}")"
          gh release edit "${TAG}" --repo "${REPO}" --notes "${BODY}"
